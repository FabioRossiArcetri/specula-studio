Integrator:
  class_name: Integrator
  bases:
  - IirFilter
  parameters:
    int_gain:
      type: list
      default: REQUIRED
      kind: data
    ff:
      type: list
      default: null
      kind: data
    n_modes:
      type: list
      default: null
      kind: data
    delay:
      type: float
      default: 0
      kind: value
    integration:
      type: bool
      default: true
      kind: value
    target_device_idx:
      type: int
      default: null
      kind: value
    precision:
      type: int
      default: null
      kind: value
  inputs:
    delta_comm:
      type: BaseValue
      kind: single
      desc: Input delta command vector
    gain_mod:
      type: BaseValue
      kind: single
      desc: Optional gain modulation vector (optional)
    in_ost:
      type: BaseValue
      kind: single
      desc: State update to subtract from integrators (optional)
  outputs:
  - name: out_comm
    type: BaseValue
    desc: Output command vector with delay applied
  - name: out_comm_no_delay
    type: BaseValue
    desc: Output command vector without delay (for POLC)
  output_names:
  - out_comm
  - out_comm_no_delay
  is_data_obj: false
