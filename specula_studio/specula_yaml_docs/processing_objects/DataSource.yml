DataSource:
  class_name: DataSource
  bases:
  - BaseProcessingObj
  parameters:
    outputs:
      type: list
      default: REQUIRED
      kind: data
    store_dir:
      type: str
      default: REQUIRED
      kind: value
    data_format:
      type: str
      default: fits
      kind: value
    global_precision:
      type: int
      default: null
      kind: value
  inputs: {}
  outputs:
  - k
  is_data_obj: false
