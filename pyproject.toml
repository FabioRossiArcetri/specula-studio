[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specula-studio"
dynamic = ["version"]
description = "Node-based visual editor for SPECULA AO simulation pipelines"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "FabioRossiArcetri" }
]
requires-python = ">=3.11"

dependencies = [
    "dearpygui>=2.1.1",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "python-socketio>=5.0.0",
]

[project.optional-dependencies]
# Only required for specula_studio/tools/compare_yamls.py
utils = [
    "deepdiff>=6.7",
]
# Full development environment
dev = [
    "deepdiff>=6.7",
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
specula-studio = "specula_studio.app:main"
specula-studio-parse = "specula_studio.tools.parse_classes:main"
specula-studio-compare = "specula_studio.tools.compare_yamls:main"

[tool.setuptools.dynamic]
version = { attr = "specula_studio.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["specula_studio*"]

[tool.setuptools.package-data]
specula_studio = ["specula_yaml_docs/**/*.yml"]

# ── Ruff (linter + formatter) ────────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["specula_studio/**/*.py", "tests/**/*.py", "main.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names, etc.)
    "B",   # flake8-bugbear (likely bugs)
]
ignore = [
    "E501",  # line-too-long — handled by formatter
    "E221",  # aligned assignments are used deliberately throughout
    "E241",
    "E272",
    "E701",
    "E702",
    "E731",
]

# ── Pytest ───────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
