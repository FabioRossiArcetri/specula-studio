main:
  class: SimulParams
  pixel_pupil: 64
  pixel_pitch: 0.01
  root_dir: ./calib/
  total_time: 1.0
  time_step: 0.001
  zenithAngleInDeg: 0
  display_server: false
  stepping: false
  add_modules: []
disturbance:
  class: WaveGenerator
  outputs: [output]
  wave_type: SIN
  amp: [5.0, 5.0]
  freq: [50.0, 50.0]
  offset: [0.0]
  constant: [0.0]
  slope: [0.0]
  output_size: 1
noise:
  class: RandomGenerator
  outputs: [output]
  distribution: NORMAL
  amp: [1.0, 1.0]
  seed: 1342
  output_size: 0
  forced_zero_modes: 0
  scaling_law: INVERSE
sum_operation_noise:
  class: BaseOperation
  outputs: [out_value]
  mul: false
  div: false
  sum: true
  sub: false
  concat: false
  inputs: {in_value1: disturbance.output, in_value2: noise.output}
demodulator:
  class: Demodulator
  outputs: [output]
  mode_numbers: [0]
  carrier_frequencies: [50.0]
  demod_dt: 1.0
  inputs: {in_data: sum_operation_noise.out_value}
  simul_params_ref: main
data_store:
  class: DataStore
  store_dir: ./data
  split_size: 0
  first_suffix: 0
  data_format: fits
  start_time: 0
  create_tn: true
  downsample_factor: 1
  inputs:
    input_list: [dem-demodulator.output]
