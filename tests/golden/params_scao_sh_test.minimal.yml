main: {class: SimulParams, pixel_pupil: 64, pixel_pitch: 0.015625, root_dir: ./calib/,
  total_time: 0.01}
seeing: {class: WaveGenerator, constant: 0.6}
wind_speed:
  class: WaveGenerator
  constant: [5.0]
wind_direction:
  class: WaveGenerator
  constant: [10.0]
on_axis_source:
  class: Source
  polar_coordinates: [0.0, 0.0]
  magnitude: 5
  wavelengthInNm: 600
pupilstop: {class: Pupilstop, simul_params_ref: main}
atmo:
  class: AtmoEvolution
  L0: 25
  heights: [0.0]
  Cn2: [1.0]
  pixel_phasescreens: 1024
  inputs: {seeing: seeing.output, wind_speed: wind_speed.output, wind_direction: wind_direction.output}
  simul_params_ref: main
prop:
  class: AtmoPropagation
  outputs: [out_on_axis_source_ef]
  inputs:
    atmo_layer_list: [atmo.layer_list]
    common_layer_list: [pupilstop, 'dm.out_layer:-1']
  simul_params_ref: main
  source_dict_ref: [on_axis_source]
sh:
  class: SH
  wavelengthInNm: 600
  subap_wanted_fov: 4.0
  sensor_pxscale: 0.5
  subap_on_diameter: 8
  subap_npx: 8
  inputs: {in_ef: prop.out_on_axis_source_ef}
detector:
  class: CCD
  size: [64, 64]
  dt: 0.001
  bandw: 300
  photon_noise: true
  readout_noise: true
  readout_level: 1.0
  quantum_eff: 0.3
  inputs: {in_i: sh.out_i}
  simul_params_ref: main
slopec:
  class: ShSlopec
  subapdata_object: scao_subaps_n8_th0.5
  weightedPixRad: 4.0
  inputs: {in_pixels: detector.out_pixels}
rec:
  class: Modalrec
  recmat_object: scao_rec_n8_th0.5
  inputs: {in_slopes: slopec.out_slopes}
control:
  class: Integrator
  int_gain: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5,
    0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5,
    0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5]
  delay: 2
  inputs: {delta_comm: rec.out_modes}
dm:
  class: DM
  height: 0
  type_str: zernike
  nmodes: 40
  obsratio: 0.1
  inputs: {in_command: control.out_comm}
  simul_params_ref: main
psf:
  class: PSF
  wavelengthInNm: 1650
  nd: 8
  inputs: {in_ef: prop.out_on_axis_source_ef}
  simul_params_ref: main
data_store:
  class: DataStore
  store_dir: ./data
  inputs:
    input_list: [res_sr-psf.out_sr]
