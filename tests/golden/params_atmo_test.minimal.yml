main: {class: SimulParams, pixel_pupil: 80, pixel_pitch: 0.1, root_dir: ./calib, total_time: 30.0,
  time_step: 0.01}
seeing: {class: WaveGenerator, constant: 0.8}
wind_speed:
  class: WaveGenerator
  outputs: [output]
  constant: [25.0]
wind_direction:
  class: WaveGenerator
  outputs: [output]
  constant: [91.5]
on_axis_source:
  class: Source
  polar_coordinates: [0.0, 0.0]
  magnitude: 8
  wavelengthInNm: 750
pupilstop: {class: Pupilstop, simul_params_ref: main}
atmo1:
  class: AtmoEvolution
  outputs: [layer_list]
  L0: 10
  heights: [0.0]
  Cn2: [1.0]
  inputs: {seeing: seeing.output, wind_speed: wind_speed.output, wind_direction: wind_direction.output}
  simul_params_ref: main
prop1:
  class: AtmoPropagation
  outputs: [out_on_axis_source_ef]
  inputs:
    atmo_layer_list: [atmo1.layer_list]
    common_layer_list: [pupilstop]
  simul_params_ref: main
  source_dict_ref: [on_axis_source]
modal_analysis1:
  class: ModalAnalysis
  outputs: [out_modes]
  type_str: zernike
  npixels: 80
  nmodes: 100
  inputs: {in_ef: prop1.out_on_axis_source_ef}
atmo2:
  class: AtmoInfiniteEvolution
  outputs: [layer_list]
  L0: [10]
  seed: 12345
  inputs: {seeing: seeing.output, wind_speed: wind_speed.output, wind_direction: wind_direction.output}
  simul_params_ref: main
prop2:
  class: AtmoPropagation
  outputs: [out_on_axis_source_ef]
  inputs:
    atmo_layer_list: [atmo2.layer_list]
    common_layer_list: [pupilstop]
  simul_params_ref: main
  source_dict_ref: [on_axis_source]
modal_analysis2:
  class: ModalAnalysis
  outputs: [out_modes]
  type_str: zernike
  npixels: 80
  nmodes: 100
  inputs: {in_ef: prop2.out_on_axis_source_ef}
data_store:
  class: DataStore
  store_dir: ./data
  inputs:
    input_list: [modes1-modal_analysis1.out_modes, modes2-modal_analysis2.out_modes]
