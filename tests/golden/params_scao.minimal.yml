main: {class: SimulParams, pixel_pupil: 160, pixel_pitch: 0.05, root_dir: ./calib/SCAO,
  total_time: 0.05}
seeing: {class: WaveGenerator, constant: 0.8}
wind_speed:
  class: WaveGenerator
  constant: [20.0]
wind_direction: {class: WaveGenerator}
on_axis_source:
  class: Source
  polar_coordinates: [0.0, 0.0]
  magnitude: 8
  wavelengthInNm: 750
pupilstop: {class: Pupilstop, simul_params_ref: main}
atmo:
  class: AtmoEvolution
  L0: 40
  heights: [119.0]
  Cn2: [1.0]
  inputs: {seeing: seeing.output, wind_speed: wind_speed.output, wind_direction: wind_direction.output}
  simul_params_ref: main
prop:
  class: AtmoPropagation
  outputs: [out_on_axis_source_ef]
  inputs:
    atmo_layer_list: [atmo.layer_list]
    common_layer_list: [pupilstop, 'dm.out_layer:-1']
  simul_params_ref: main
  source_dict_ref: [on_axis_source]
pyramid:
  class: ModulatedPyramid
  wavelengthInNm: 750
  fov: 2.0
  pup_diam: 30.0
  output_resolution: 80
  pup_dist: 36.0
  inputs: {in_ef: prop.out_on_axis_source_ef}
  simul_params_ref: main
detector:
  class: CCD
  size: [80, 80]
  dt: 0.001
  bandw: 300
  photon_noise: true
  readout_noise: true
  readout_level: 1.0
  quantum_eff: 0.32
  inputs: {in_i: pyramid.out_i}
  simul_params_ref: main
slopec:
  class: PyrSlopec
  pupdata_object: scao_pup
  inputs: {in_pixels: detector.out_pixels}
rec:
  class: Modalrec
  recmat_object: scao_recmat
  inputs: {in_slopes: slopec.out_slopes}
control:
  class: Integrator
  int_gain: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5,
    0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5,
    0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5,
    0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5]
  delay: 2
  inputs: {delta_comm: rec.out_modes}
dm:
  class: DM
  height: 0
  type_str: zernike
  nmodes: 54
  obsratio: 0.1
  inputs: {in_command: control.out_comm}
  simul_params_ref: main
psf:
  class: PSF
  wavelengthInNm: 1650
  nd: 8
  start_time: 0.05
  inputs: {in_ef: prop.out_on_axis_source_ef}
  simul_params_ref: main
data_store:
  class: DataStore
  store_dir: ./output
  inputs:
    input_list: [res_ef-prop.out_on_axis_source_ef]
