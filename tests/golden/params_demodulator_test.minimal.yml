main: {class: SimulParams, pixel_pupil: 64, pixel_pitch: 0.01, root_dir: ./calib/,
  total_time: 1.0}
disturbance:
  class: WaveGenerator
  outputs: [output]
  amp: [5.0, 5.0]
  freq: [50.0, 50.0]
noise:
  class: RandomGenerator
  outputs: [output]
  amp: [1.0, 1.0]
  seed: 1342
sum_operation_noise:
  class: BaseOperation
  outputs: [out_value]
  sum: true
  inputs: {in_value1: disturbance.output, in_value2: noise.output}
demodulator:
  class: Demodulator
  outputs: [output]
  mode_numbers: [0]
  carrier_frequencies: [50.0]
  demod_dt: 1.0
  inputs: {in_data: sum_operation_noise.out_value}
  simul_params_ref: main
data_store:
  class: DataStore
  store_dir: ./data
  inputs:
    input_list: [dem-demodulator.output]
