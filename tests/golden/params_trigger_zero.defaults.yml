main:
  class: SimulParams
  pixel_pupil: 160
  pixel_pitch: 0.05
  root_dir: ./calib/SCAO
  total_time: 0.01
  time_step: 0.001
  zenithAngleInDeg: 0
  display_server: false
  stepping: false
  add_modules: []
on_axis_source:
  class: Source
  polar_coordinates: [0.0, 0.0]
  magnitude: 8
  wavelengthInNm: 750
  height: .inf
  zero_point: 0
  error_coord: [0.0, 0.0]
pupilstop:
  class: Pupilstop
  mask_diam: 1.0
  shiftXYinPixel: [0.0, 0.0]
  rotInDeg: 0.0
  magnification: 1.0
  simul_params_ref: main
prop:
  class: AtmoPropagation
  outputs: [out_on_axis_source_ef]
  doFresnel: false
  wavelengthInNm: 500.0
  enable_chromatic_effect: false
  mergeLayersContrib: true
  upwards: false
  padding_factor: 1
  inputs:
    common_layer_list: [pupilstop]
  simul_params_ref: main
  source_dict_ref: [on_axis_source]
