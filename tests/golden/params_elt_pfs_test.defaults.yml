  class: IirFilter
  delay: 2
  inputs: {delta_comm: sum_operation_pfs_noise.out_value}
  iir_filter_data_ref: temporal_filter
dm:
  class: DM
  height: 0
  inputs: {in_command: control.out_comm}
  simul_params_ref: main
  ifunc_ref: zern_ifunc
modal_analysis:
  class: ModalAnalysis
  type_str: zernike
  npixels: 128
  obsratio: 0.283
  nmodes: 50
  inputs: {in_ef: prop.out_on_axis_source_ef}
data_store:
  class: DataStore
  store_dir: ./output
  inputs:
