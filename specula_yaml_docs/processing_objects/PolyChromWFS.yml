PolyChromWFS:
  class_name: PolyChromWFS
  bases:
  - BaseProcessingObj
  parameters:
    wavelengthInNm:
      type: list
      default: REQUIRED
      kind: data
    ccd_side:
      type: int
      default: REQUIRED
      kind: value
    flux_factor:
      type: list
      default: REQUIRED
      kind: data
    xy_tilts_in_arcsec:
      type: list
      default: null
      kind: data
    target_device_idx:
      type: int
      default: null
      kind: value
    precision:
      type: int
      default: null
      kind: value
  inputs:
    in_ef:
      type: ElectricField
      kind: single
      desc: Input electric field from the telescope pupil
  outputs:
  - name: out_i
    type: Intensity
    desc: Output intensity on the detector
  output_names:
  - out_i
  is_data_obj: false
